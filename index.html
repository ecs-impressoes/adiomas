
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Álbum Digital Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --bg: #f3f4f6;
  --sidebar: #1f2937;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Inter', system-ui, -apple-system, sans-serif; 
  background: var(--bg);
  overflow: hidden;
}

.scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll-thin::-webkit-scrollbar-track { background: transparent; }
.scroll-thin::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }
.scroll-thin::-webkit-scrollbar-thumb:hover { background: #6b7280; }

.page {
  background: #fff;
  box-shadow: 0 10px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04);
  position: relative;
  margin: 20px auto;
  transition: all 0.3s ease;
}

.a4-v { width: 210mm; height: 297mm; }
.a4-h { width: 297mm; height: 210mm; }
.a5-v { width: 148mm; height: 210mm; }
.a5-h { width: 210mm; height: 148mm; }

.foto {
  position: absolute;
  cursor: move;
  border: 2px solid transparent;
  transition: border 0.15s ease;
  user-select: none;
}

.foto:hover { border-color: rgba(59, 130, 246, 0.5); }
.foto.sel { 
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
}

.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.resize-handle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--primary);
  border: 2px solid #fff;
  border-radius: 50%;
  bottom: -5px;
  right: -5px;
  cursor: nwse-resize;
  display: none;
}
.foto.sel .resize-handle { display: block; }

.thumb {
  width: 100%;
  background: #374151;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.thumb:hover { border-color: #6b7280; transform: scale(1.02); }
.thumb.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }

.thumb-page {
  width: 100%;
  aspect-ratio: 210/297;
  background: #fff;
  position: relative;
  transform: scale(0.8);
}

.bandeja-item {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.bandeja-item:hover { transform: scale(1.05); }
.bandeja-item img { width: 100%; height: 80px; object-fit: cover; }

.guide-line {
  position: absolute;
  background: #ef4444;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
}
.guide-v { width: 1px; height: 100%; top: 0; }
.guide-h { height: 1px; width: 100%; left: 0; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.3s ease; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .app { display: block; }
  #printContainer { display: block !important; }
  .page { margin: 0; box-shadow: none; page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  @page { margin: 0; }
}

@media (max-width: 1024px) {
  .app { flex-direction: column; }
  .side, .props { 
    width: 100% !important; 
    height: auto;
    max-height: 200px;
  }
  .main { padding: 10px; }
  .page { transform: scale(0.4) !important; }
}
</style>
</head>
<body>
<div class="app flex h-screen no-print">
  <!-- Sidebar Páginas -->
  <div class="side w-64 bg-gray-800 text-white p-4 overflow-y-auto scroll-thin">
    <div class="flex items-center gap-2 mb-6">
      <i data-lucide="book-image" class="w-6 h-6 text-blue-400"></i>
      <h1 class="text-lg font-bold">Álbum Digital</h1>
    </div>
    
    <div class="space-y-2 mb-4">
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors text-sm font-medium" onclick="novaPg()">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Nova Página
      </button>
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-sm font-medium" onclick="duplicarPg()">
        <i data-lucide="copy" class="w-4 h-4"></i>
        Duplicar Página
      </button>
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-sm font-medium" onclick="removerPg()">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        Remover Página
      </button>
    </div>

    <div class="border-t border-gray-700 pt-4 mb-4">
      <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Páginas</h3>
      <div id="thumbs" class="space-y-2"></div>
    </div>

    <div class="border-t border-gray-700 pt-4 space-y-2">
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors text-sm font-medium" onclick="exportarPDF()">
        <i data-lucide="file-down" class="w-4 h-4"></i>
        Exportar PDF
      </button>
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-sm font-medium" onclick="exportarJSON()">
        <i data-lucide="save" class="w-4 h-4"></i>
        Salvar Projeto
      </button>
      <button class="w-full flex items-center gap-2 px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors text-sm font-medium" onclick="importarJSON()">
        <i data-lucide="folder-open" class="w-4 h-4"></i>
        Abrir Projeto
      </button>
    </div>
  </div>

  <!-- Main Canvas -->
  <div class="main flex-1 flex items-center justify-center overflow-auto p-8 bg-gray-100 relative">
    <div class="absolute top-4 left-4 bg-white rounded-lg shadow-lg px-4 py-2 text-sm text-gray-600 no-print">
      <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
      <span id="pageInfo">Página 1 de 2</span>
    </div>
    <div id="pageWrapper" style="transform-origin: top center;">
      <div id="page" class="page a4-v"></div>
      <div class="guide-line guide-v" id="guideV"></div>
      <div class="guide-line guide-h" id="guideH"></div>
    </div>
  </div>

  <!-- Properties Panel -->
  <div class="props w-80 bg-white border-l border-gray-200 p-5 overflow-y-auto scroll-thin">
    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
      <i data-lucide="settings" class="w-5 h-5"></i>
      Propriedades
    </h2>

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Formato da Página</label>
        <select id="fmt" onchange="trocarFmt()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <option value="a4-v">A4 Vertical (210×297mm)</option>
          <option value="a4-h">A4 Horizontal (297×210mm)</option>
          <option value="a5-v">A5 Vertical (148×210mm)</option>
          <option value="a5-h">A5 Horizontal (210×148mm)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Zoom</label>
        <input type="range" id="zoom" min="30" max="150" value="60" class="w-full" oninput="updateZoom(this.value)">
        <div class="text-xs text-gray-500 text-center mt-1"><span id="zoomVal">60</span>%</div>
      </div>
    </div>

    <div class="border-t border-gray-200 pt-4 mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Adicionar Fotos</label>
      <label class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-blue-50 hover:bg-blue-100 border-2 border-dashed border-blue-300 rounded-lg cursor-pointer transition-colors">
        <i data-lucide="upload" class="w-5 h-5 text-blue-600"></i>
        <span class="text-sm font-medium text-blue-600">Enviar Imagens</span>
        <input type="file" id="up" multiple accept="image/*" class="hidden">
      </label>
      <div id="bandeja" class="grid grid-cols-3 gap-2 mt-3 max-h-64 overflow-y-auto scroll-thin"></div>
    </div>

    <div id="propsFoto" class="border-t border-gray-200 pt-4 space-y-4" style="display:none">
      <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
        <i data-lucide="image" class="w-4 h-4"></i>
        Foto Selecionada
      </h3>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">X (px)</label>
          <input type="number" id="px" onchange="upd()" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Y (px)</label>
          <input type="number" id="py" onchange="upd()" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Largura</label>
          <input type="number" id="pw" onchange="upd()" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Altura</label>
          <input type="number" id="ph" onchange="upd()" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Rotação (graus)</label>
        <input type="range" id="pr" min="-180" max="180" value="0" onchange="upd()" class="w-full">
        <div class="text-xs text-gray-500 text-center mt-1"><span id="rotVal">0</span>°</div>
      </div>

      <div class="space-y-2 pt-2">
        <button class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors text-sm font-medium text-gray-700" onclick="frente()">
          <i data-lucide="arrow-up" class="w-4 h-4"></i>
          Trazer para Frente
        </button>
        <button class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors text-sm font-medium text-gray-700" onclick="tras()">
          <i data-lucide="arrow-down" class="w-4 h-4"></i>
          Enviar para Trás
        </button>
        <button class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition-colors text-sm font-medium" onclick="del()">
          <i data-lucide="trash" class="w-4 h-4"></i>
          Deletar Foto
        </button>
      </div>
    </div>

    <div class="mt-6 pt-4 border-t border-gray-200">
      <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Atalhos</h3>
      <div class="text-xs text-gray-600 space-y-1">
        <div><kbd class="px-1.5 py-0.5 bg-gray-100 rounded">Del</kbd> Deletar foto</div>
        <div><kbd class="px-1.5 py-0.5 bg-gray-100 rounded">Ctrl+S</kbd> Salvar projeto</div>
        <div><kbd class="px-1.5 py-0.5 bg-gray-100 rounded">Ctrl+D</kbd> Duplicar foto</div>
        <div><kbd class="px-1.5 py-0.5 bg-gray-100 rounded">Click</kbd> na bandeja p/ adicionar</div>
      </div>
    </div>
  </div>
</div>

<div id="printContainer" style="display:none"></div>
<input type="file" id="importInput" accept=".json" style="display:none">

<script>
let p = {fmt:'a4-v',pgs:[{id:'Capa',f:[]},{id:'Contracapa',f:[]}],pg:0,zoom:60};
let s = null, d = null, r = null;
let bandejaImgs = [];

const init = () => {
  const v = localStorage.getItem('albumPro');
  if(v) {
    p = JSON.parse(v);
    document.getElementById('fmt').value = p.fmt;
  }
  render();
  updateZoom(p.zoom);
  lucide.createIcons();
};
init();

function render() {
  const page = document.getElementById('page');
  page.className = 'page ' + p.fmt;
  page.innerHTML = '';
  
  p.pgs[p.pg].f.forEach((f,i) => {
    const div = document.createElement('div');
    div.className = 'foto fade-in' + (s===i?' sel':'');
    div.style.cssText = `left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;transform:rotate(${f.r}deg);z-index:${f.z}`;
    div.innerHTML = `<img src="${f.src}"><div class="resize-handle"></div>`;
    div.onmousedown = e => {
      if(e.target.classList.contains('resize-handle')) {
        startResize(e, i);
      } else {
        start(e, i);
      }
    };
    page.appendChild(div);
  });
  
  thumbs();
  updatePageInfo();
  save();
  lucide.createIcons();
}

function thumbs() {
  const d = document.getElementById('thumbs');
  d.innerHTML = '';
  p.pgs.forEach((pg, i) => {
    const t = document.createElement('div');
    t.className = 'thumb' + (i === p.pg ? ' active' : '');
    t.innerHTML = `
      <div class="thumb-page">
        <div class="absolute inset-2 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-500">
          ${i + 1}
        </div>
      </div>
      <div class="px-2 py-1.5 text-xs font-medium text-center truncate">${pg.id}</div>
    `;
    t.onclick = () => { p.pg = i; s = null; render(); props(); };
    d.appendChild(t);
  });
}

function updatePageInfo() {
  document.getElementById('pageInfo').textContent = `Página ${p.pg + 1} de ${p.pgs.length}`;
}

function start(e, i) {
  if(e.button !== 0) return;
  s = i;
  const page = document.getElementById('page');
  const rect = page.getBoundingClientRect();
  const scale = p.zoom / 100;
  d = {
    x: (e.clientX - rect.left) / scale - p.pgs[p.pg].f[i].x,
    y: (e.clientY - rect.top) / scale - p.pgs[p.pg].f[i].y
  };
  render();
  document.onmousemove = move;
  document.onmouseup = end;
  props();
  e.preventDefault();
}

function move(e) {
  if(d === null) return;
  const page = document.getElementById('page');
  const rect = page.getBoundingClientRect();
  const scale = p.zoom / 100;
  const f = p.pgs[p.pg].f[s];
  f.x = Math.round((e.clientX - rect.left) / scale - d.x);
  f.y = Math.round((e.clientY - rect.top) / scale - d.y);
  
  // Snap to center guides
  const pageW = page.offsetWidth;
  const pageH = page.offsetHeight;
  const centerX = pageW / 2;
  const centerY = pageH / 2;
  const snapDist = 10;
  
  const guideV = document.getElementById('guideV');
  const guideH = document.getElementById('guideH');
  
  if(Math.abs(f.x + f.w/2 - centerX) < snapDist) {
    f.x = centerX - f.w/2;
    guideV.style.left = centerX + 'px';
    guideV.style.opacity = '0.5';
  } else {
    guideV.style.opacity = '0';
  }
  
  if(Math.abs(f.y + f.h/2 - centerY) < snapDist) {
    f.y = centerY - f.h/2;
    guideH.style.top = centerY + 'px';
    guideH.style.opacity = '0.5';
  } else {
    guideH.style.opacity = '0';
  }
  
  render();
}

function startResize(e, i) {
  s = i;
  const f = p.pgs[p.pg].f[i];
  r = { startX: e.clientX, startY: e.clientY, startW: f.w, startH: f.h };
  document.onmousemove = resize;
  document.onmouseup = end;
  e.stopPropagation();
  e.preventDefault();
}

function resize(e) {
  if(r === null) return;
  const f = p.pgs[p.pg].f[s];
  const dx = e.clientX - r.startX;
  f.w = Math.max(50, r.startW + dx);
  f.h = Math.max(50, r.startH + dx * (r.startH / r.startW)); // Keep aspect ratio
  render();
}

function end() {
  d = null;
  r = null;
  document.onmousemove = null;
  document.getElementById('guideV').style.opacity = '0';
  document.getElementById('guideH').style.opacity = '0';
}

document.getElementById('up').onchange = e => {
  Array.from(e.target.files).forEach(file => {
    const r = new FileReader();
    r.onload = ev => {
      bandejaImgs.push(ev.target.result);
      renderBandeja();
    };
    r.readAsDataURL(file);
  });
};

function renderBandeja() {
  const b = document.getElementById('bandeja');
  b.innerHTML = '';
  bandejaImgs.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'bandeja-item';
    div.innerHTML = `<img src="${src}">`;
    div.onclick = () => addF(src);
    b.appendChild(div);
  });
}

function addF(src) {
  const img = new Image();
  img.onload = () => {
    const maxW = 300;
    const maxH = 300;
    let w = img.width;
    let h = img.height;
    if(w > maxW || h > maxH) {
      const ratio = Math.min(maxW/w, maxH/h);
      w *= ratio;
      h *= ratio;
    }
    p.pgs[p.pg].f.push({src,x:50,y:50,w:Math.round(w),h:Math.round(h),r:0,z:p.pgs[p.pg].f.length+1});
    render();
  };
  img.src = src;
}

function novaPg() {
  const nome = prompt('Nome da página:', `Página ${p.pgs.length}`);
  if(!nome) return;
  p.pgs.splice(p.pgs.length-1,0,{id:nome,f:[]});
  p.pg = p.pgs.length-2;
  s = null;
  render();
}

function duplicarPg() {
  const c = JSON.parse(JSON.stringify(p.pgs[p.pg]));
  c.id += ' (cópia)';
  p.pgs.splice(p.pg+1,0,c);
  p.pg++;
  render();
}

function removerPg() {
  if(p.pgs.length <= 2) return alert('O álbum precisa ter pelo menos Capa e Contracapa!');
  if(p.pg === 0 || p.pg === p.pgs.length-1) return alert('Não é possível remover Capa ou Contracapa!');
  if(!confirm('Remover esta página?')) return;
  p.pgs.splice(p.pg, 1);
  if(p.pg >= p.pgs.length) p.pg = p.pgs.length-1;
  s = null;
  render();
}

function props() {
  if(s===null) {
    document.getElementById('propsFoto').style.display='none';
    return;
  }
  const f = p.pgs[p.pg].f[s];
  document.getElementById('propsFoto').style.display='block';
  document.getElementById('px').value = Math.round(f.x);
  document.getElementById('py').value = Math.round(f.y);
  document.getElementById('pw').value = Math.round(f.w);
  document.getElementById('ph').value = Math.round(f.h);
  document.getElementById('pr').value = f.r;
  document.getElementById('rotVal').textContent = f.r;
}

function upd() {
  if(s===null) return;
  const f = p.pgs[p.pg].f[s];
  f.x = parseInt(document.getElementById('px').value) || 0;
  f.y = parseInt(document.getElementById('py').value) || 0;
  f.w = parseInt(document.getElementById('pw').value) || 50;
  f.h = parseInt(document.getElementById('ph').value) || 50;
  f.r = parseInt(document.getElementById('pr').value) || 0;
  document.getElementById('rotVal').textContent = f.r;
  render();
}

function frente() {
  if(s!==null) {
    const maxZ = Math.max(...p.pgs[p.pg].f.map(f => f.z));
    p.pgs[p.pg].f[s].z = maxZ + 1;
    render();
  }
}

function tras() {
  if(s!==null) {
    const minZ = Math.min(...p.pgs[p.pg].f.map(f => f.z));
    p.pgs[p.pg].f[s].z = minZ - 1;
    render();
  }
}

function del() {
  if(s!==null) {
    p.pgs[p.pg].f.splice(s,1);
    s = null;
    render();
    props();
  }
}

function trocarFmt() {
  p.fmt = document.getElementById('fmt').value;
  render();
}

function updateZoom(val) {
  p.zoom = parseInt(val);
  document.getElementById('zoomVal').textContent = val;
  document.getElementById('pageWrapper').style.transform = `scale(${val/100})`;
}

function exportarPDF() {
  const container = document.getElementById('printContainer');
  container.innerHTML = '';
  p.pgs.forEach(pg => {
    const div = document.createElement('div');
    div.className = 'page ' + p.fmt;
    pg.f.forEach(f => {
      const foto = document.createElement('div');
      foto.className = 'foto';
      foto.style.cssText = `left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;transform:rotate(${f.r}deg);z-index:${f.z}`;
      foto.innerHTML = `<img src="${f.src}">`;
      div.appendChild(foto);
    });
    container.appendChild(div);
  });
  
  const st = document.createElement('style');
  const size = p.fmt.includes('a4') ? 'A4' : 'A5';
  const orient = p.fmt.includes('h') ? 'landscape' : 'portrait';
  st.textContent = `@page{size:${size} ${orient};margin:0}`;
  document.head.appendChild(st);
  window.print();
  setTimeout(() => {
    container.innerHTML = '';
    st.remove();
  }, 100);
}

function exportarJSON() {
  const blob = new Blob([JSON.stringify(p)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `album-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarJSON() {
  document.getElementById('importInput').click();
}

document.getElementById('importInput').onchange = e => {
  const r = new FileReader();
  r.onload = ev => {
    try {
      p = JSON.parse(ev.target.result);
      document.getElementById('fmt').value = p.fmt;
      updateZoom(p.zoom || 60);
      s = null;
      render();
    } catch(err) {
      alert('Erro ao carregar projeto: arquivo inválido');
    }
  };
  r.readAsText(e.target.files[0]);
};

function save() {
  localStorage.setItem('albumPro', JSON.stringify(p));
}

// Atalhos de teclado
document.addEventListener('keydown', e => {
  if(e.key === 'Delete' && s !== null) {
    del();
  }
  if(e.ctrlKey && e.key === 's') {
    e.preventDefault();
    exportarJSON();
  }
  if(e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    if(s !== null) {
      const f = JSON.parse(JSON.stringify(p.pgs[p.pg].f[s]));
      f.x += 20;
      f.y += 20;
      f.z = Math.max(...p.pgs[p.pg].f.map(f => f.z)) + 1;
      p.pgs[p.pg].f.push(f);
      s = p.pgs[p.pg].f.length - 1;
      render();
      props();
    }
  }
  if(e.key === 'Escape') {
    s = null;
    render();
    props();
  }
});

// Click fora da página deseleciona
document.getElementById('pageWrapper').parentElement.onclick = e => {
  if(e.target.id === 'pageWrapper' || e.target.classList.contains('main')) {
    s = null;
    render();
    props();
  }
};

// Auto-save a cada 3s
setInterval(save, 3000);

// Drag and drop na bandeja
const page = document.getElementById('page');
page.ondragover = e => {
  e.preventDefault();
  page.style.background = '#f0f9ff';
};
page.ondragleave = () => {
  page.style.background = '#fff';
};
page.ondrop = e => {
  e.preventDefault();
  page.style.background = '#fff';
  const files = e.dataTransfer.files;
  Array.from(files).forEach(file => {
    if(file.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = ev => addF(ev.target.result);
      r.readAsDataURL(file);
    }
  });
};
